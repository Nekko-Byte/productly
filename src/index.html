<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productly</title>
</head>
<body>
  <header class="header">
    <div class="header__inner container">
      <a 
        class="header__logo logo" 
        href="#" 
        aria-current="page"
      >
        <img 
          class="logo__image"
          src="~@icons/logo.svg" 
          alt="Logo company Productly"
          width="147" 
          height="29"
          loading="lazy"
        >
      </a>

      <nav 
        class="header__menu menu" 
        aria-label="Main navigation"
      >
        <ul class="menu__list">
          <li class="menu__item">
            <a class="menu__link" href="#">Home</a>
          </li>
          <li class="menu__item">
            <a class="menu__link" href="#">Services</a>
          </li>
          <li class="menu__item">
            <a class="menu__link" href="#">About</a>
          </li>
          <li class="menu__item">
            <a class="menu__link" href="#">Product</a>
          </li>
        </ul>
      </nav>
      <div class="header__buttons">
        <button 
          class="header__button button button__bordered"
          type="button" 
          aria-label="Sign In"
        >
          Sign In
        </button>
        <button 
          class="header__button button button__accent"
          type="button" 
          aria-label="Sign Up"
        >
          Sign Up
        </button>
      </div>
    </div>
  </header>
  <main class="main">
    <section class="hero">
      <div class="hero__inner container">
      <div class="hero__body">
        <h1 class="hero__title">The Design Thinking superpowers</h1>
        <div class="hero__description">
          <p>Tools, tutorials, design and innovation experts, all in one place! The most intuitive way to imagine your next user experience.</p>
        </div>
        <div class="hero__links">
          <a class="hero__link button button__accent" href="#">Get started</a>
          <a class="hero__link link link__accent" href="">Watch the Video</a>
        </div>
      </div>
      <img
        class="hero__image-bg" 
        src="~@icons/hero-bg.svg" 
        alt=""
        width="643"
        height="495"
        loading="lazy"
      >
      </div>
    </section>
  </main>
</body>
</html>
